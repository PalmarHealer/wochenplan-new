; Custom PHP configuration
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300

; Hardening
expose_php = Off
; Upload progress tracking is unused; disabling it removes the attack surface of
; CVE-2026-109619 (PHP2Shell) as defense in depth on top of the patched PHP version.
session.upload_progress.enabled = Off
