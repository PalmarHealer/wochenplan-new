# Log rotation for the Wochenplan container.
#
# Both /var/log/nginx and storage/logs are Docker volumes, so anything written
# there survives container restarts and grows without bound. copytruncate is
# used because nginx and php-fpm hold these files open and there is no
# reliable way to signal both from the rotation loop.

/var/log/nginx/*.log {
    size 50M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

/var/www/html/storage/logs/*.log {
    size 20M
    rotate 5
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
